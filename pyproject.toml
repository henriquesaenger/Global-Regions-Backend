[project]
name = "plone-global-regions"
dynamic = ["version"]
description = "Named global block regions for Plone sites"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "CMS",
    "Plone",
    "Volto",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: Addon",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Products.CMFPlone>=6.1.1,<6.2",
    "plone.restapi>=9.13.3,<10",
]

[project.optional-dependencies]
test = [
    "horse-with-no-namespace",
    "plone.app.testing",
    "plone.restapi[test]",
    "pytest",
    "pytest-cov",
    "pytest-plone>=0.5.0",
]

[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/global_regions/__init__.py"

[tool.hatch.build]
strict-naming = true

[tool.hatch.build.targets.wheel]
packages = ["src/global_regions"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["global_regions", "tests"]
branch = true
parallel = true

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
lint.select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "PGH",
    "RUF",
    "S",
    "SIM",
    "T10",
    "UP",
    "W",
    "YTT",
]
lint.ignore = ["E731"]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]
